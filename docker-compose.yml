services:
  calendar-bot:
    build: .
    container_name: calendar-bot
    restart: unless-stopped

    ports:
      - "8000:8000"

    volumes:
      # SQLite БД — персистентно между перезапусками
      - bot-data:/app/data

    env_file:
      - .env

    environment:
      # Переопределяем путь к БД на volumen
      DATABASE_URL: "sqlite+aiosqlite:////app/data/bot.db"
      WEBHOOK_HOST: "0.0.0.0"
      PORT: "8000"

volumes:
  bot-data:
